services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: todolist_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:

